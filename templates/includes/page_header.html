<div class="page-header fade-in">
    <div>
        <h1 class="page-header-title">
            {% if icon %}<i class="{{ icon }} me-2 {% if icon_color %}{{ icon_color }}{% else %}text-primary-pro{% endif %}"></i>{% endif %}
            {{ title }}
        </h1>
        {% if subtitle %}
        <p class="page-header-subtitle">{{ subtitle }}</p>
        {% endif %}
    </div>
    {% if actions %}
    <div class="page-header-actions">
        {{ actions }}
    </div>
    {% endif %}
</div>
